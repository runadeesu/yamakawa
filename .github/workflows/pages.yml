# GitHub Pages へ自動デプロイする (https://<user>.github.io/<repo>/)
#
# 初回だけ手動で必要: リポジトリの Settings → Pages → Build and deployment → Source を「GitHub Actions」にする。
# (GITHUB_TOKEN には Pages を有効化する権限がないため、ここは自動化できない)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, ccr-d001007b-6pbzb2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test
        run: npm test
      # .env.production (公開用の Supabase URL / publishable key) を読んでビルドされる。秘密鍵は含まれない
      - name: Build
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
